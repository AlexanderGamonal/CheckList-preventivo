══════════════════════════════════════ */
      const POWER_AUTOMATE_URL = "TU_URL_POWER_AUTOMATE_AQUI";

      /* ══════════════════════════════════════════════════════
   VOLTAJE
   L-N / L-T : 220V ± 5%  →  rango 209V – 231V
   N-T       : máximo 5V  →  si > 5V: desbalanceado
══════════════════════════════════════════════════════ */
      const VOLT_IDEAL = 220;
      const VOLT_TOL_PCT = 0.05;
      const VOLT_MIN = VOLT_IDEAL * (1 - VOLT_TOL_PCT); // 209 V
      const VOLT_MAX = VOLT_IDEAL * (1 + VOLT_TOL_PCT); // 231 V
      const NT_MAX = 5; // V máximo permitido Neutro-Tierra
      const VOLT_ITEMS = [
        "Cable interno ATM",
        "UPS",
        "Transformador Aislamiento",
        "Toma Eléctrica",
      ];

      /* Valida un campo específico según su tipo */
      function voltEstadoCampo(campo, valor) {
        const v = parseFloat(valor);
        if (isNaN(v) || valor === "" || valor === null) return null;
        if (campo === "nt") return v <= NT_MAX ? "ok" : "err";
        return v >= VOLT_MIN && v <= VOLT_MAX ? "ok" : "err";
      }

      /* Alias para compatibilidad con referencias existentes */
      function voltEstado(valor) {
        return voltEstadoCampo("ln", valor);
      }

      /* Genera el mensaje de observación automático */
      function voltMensaje(ln, lt, nt) {
        const partes = [];
        const llenos = [ln, lt].filter(
          (v) => v !== "" && v !== null && v !== undefined,
        );
        if (llenos.length > 0) {
          partes.push(
            llenos.some((v) => voltEstadoCampo("ln", v) === "err")
              ? "Voltajes fuera del rango permitido"
              : "Voltajes dentro del rango permitido",
          );
        }
        if (nt !== "" && nt !== null && nt !== undefined) {
          if (voltEstadoCampo("nt", nt) === "err") {
            partes.push("Voltajes desbalanceados (Revisar la toma a tierra)");
          }
        }
        return partes.join(" — ");
      }

      function BrandLogo({ marca, height = 40, style = {} }) {
        const src = LOGO_SRCS[marca];
        if (!src) return null;
        // Contenedor fijo: misma altura Y mismo ancho para los 3 logos
        return (
          <div
            style={{
              width: height * 2.5, // relación fija para que todos ocupen el mismo espacio
              height: height,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              ...style,
            }}
          >
            <img
              src={src}
              alt={marca}
              style={{
                maxWidth: "100%",
                maxHeight: "100%",
                objectFit: "contain",
                display: "block",
              }}
            />
          </div>
        );
      }

      function getSections(atmTipo, marca) {
        if (!atmTipo) return [];
        const secs = [SEC_LECTORA, SEC_IMPRESORA];

        if (
          (atmTipo === "dispensador" || atmTipo === "multifuncion") &&
          marca &&
          DISP_MAP[marca]
        ) {
          secs.push(DISP_MAP[marca]);
        }
        if (
          (atmTipo === "depositos" || atmTipo === "multifuncion") &&
          marca &&
          ACEPT_MAP[marca]
        ) {
          secs.push(ACEPT_MAP[marca]);
        }

        secs.push(SEC_MONITOR, SEC_TECLADO, SEC_CPU, SEC_OTROS);
        return secs;

        const v = {};
        VOLT_ITEMS.forEach((k) => {
          v[k] = { ln: "", lt: "", nt: "", obs: "" };
        });
        return v;

        const d = {};

      /* ══════════════════════════════════════
   POWER AUTOMATE
══════════════════════════════════════ */
      async function enviarAPowerAutomate(form, sections) {
        const conteo = { Bueno: 0, Defectuoso: 0, Regular: 0, "No Aplica": 0 };
        sections.forEach((s) =>
          s.items.forEach((_, ii) => {
            const est = form.devices[s.id + "_" + ii]?.est;
            if (est && conteo[est] !== undefined) conteo[est]++;
          }),
        );
        const voltResumen = VOLT_ITEMS.map((item) => {
          const v = form.voltages[item];
          return `${item}: L-N=${v.ln || "-"}V / L-T=${v.lt || "-"}V / N-T=${v.nt || "-"}V — ${v.obs || "sin dato"}`;
        }).join(" | ");

        const payload = {
          fecha: form.fecha,
          numero_interno: form.num,
          punto_agencia: form.punto,
          id_atm: form.idAtm,
          marca: form.marca,
          modelo: form.modelo,
          tipo_cajero:
            ATM_TIPOS.find((t) => t.id === form.atmTipo)?.label || form.atmTipo,
          tecnico: form.tec,
          estado_final: form.estFinal,
          dispositivos_buenos: String(conteo.Bueno),
          dispositivos_defectuosos: String(conteo.Defectuoso),
          dispositivos_regulares: String(conteo.Regular),
          dispositivos_no_aplica: String(conteo["No Aplica"]),
          voltajes: voltResumen,
          observaciones: form.obsGen,
          resultados: form.res,
          recomendaciones: form.rec,
          timestamp: new Date().toISOString(),
        };

        const resp = await fetch(POWER_AUTOMATE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return payload;
      }

      function Toast({ msg, type, onClose }) {
        const bg =
          type === "ok" ? "#16a34a" : type === "err" ? "#dc2626" : "#2563eb";
        const icon = type === "ok" ? "✅" : type === "err" ? "❌" : "⏳";
        React.useEffect(() => {
          if (type === "ok" || type === "err") {
            const t = setTimeout(onClose, 3500);
            return () => clearTimeout(t);
          }
        }, [type]);
        return (
          <div className="toast no-print" style={{ background: bg }}>
            <span>{icon}</span>
            <span>{msg}</span>
          </div>
        );
      }

            r.readAsDataURL(file);

      function App() {
        const [form, setForm] = useState(initForm());
        const [fotosAntes, setFotosAntes] = useState([]);
        const [fotosDespues, setFotosDespues] = useState([]);
        const [tab, setTab] = useState(0);
        const [toast, setToast] = useState(null);
        const [enviando, setEnviando] = useState(false);

        const upd = (f, v) => setForm((p) => ({ ...p, [f]: v }));

        /* Cuando cambia tipo, resetear marca y devices */
        function cambiarTipo(nuevoTipo) {
          setForm((p) => ({
            ...p,
            atmTipo: nuevoTipo,
            marca: "",
            devices: {},
          }));
        }

        /* Cuando cambia marca, resetear devices */
        function cambiarMarca(nuevaMarca) {
          const secs = getSections(form.atmTipo, nuevaMarca);
          setForm((p) => ({
            ...p,
            marca: nuevaMarca,
            devices: initDevicesFor(secs),
          }));
        }

        const updV = (item, f, v) =>
          setForm((p) => {
            const prev = p.voltages[item];
            const updated = { ...prev, [f]: v };
            updated.obs = voltMensaje(
              f === "ln" ? v : updated.ln,
              f === "lt" ? v : updated.lt,
              f === "nt" ? v : updated.nt,
            );
            return { ...p, voltages: { ...p.voltages, [item]: updated } };
          });
        const updD = useCallback(
          (key, f, v) =>
            setForm((p) => ({
              ...p,
              devices: { ...p.devices, [key]: { ...p.devices[key], [f]: v } },
            })),
          [],
        );

        const tipoObj = ATM_TIPOS.find((t) => t.id === form.atmTipo) || null;
        const marcaObj = form.marca ? MARCA_CONFIG[form.marca] : null;
        const sections = useMemo(
          () => getSections(form.atmTipo, form.marca),
          [form.atmTipo, form.marca],
        );
        const marcasDisp = form.atmTipo ? MARCAS_POR_TIPO[form.atmTipo] : [];

        const total = sections.reduce((a, s) => a + s.items.length, 0);
        const filled = sections.reduce(
          (a, s) =>
            a +
            s.items.filter((_, ii) => form.devices[s.id + "_" + ii]?.est !== "")
              .length,
          0,
        );
        const pct = total > 0 ? Math.round((filled / total) * 100) : 0;

        const accentBg = tipoObj?.color || "#1e3a5f";

        function validar() {
          if (!form.atmTipo) return "Selecciona el tipo de cajero";
          if (!form.marca) return "Selecciona la marca del cajero";
          if (!form.punto) return "Ingresa el Nombre del Punto / Agencia";
          if (!form.fecha) return "Ingresa la fecha de mantenimiento";
          if (!form.idAtm) return "Ingresa el ID del ATM";
          if (!form.tec) return "Ingresa el nombre del técnico";
          if (!form.estFinal)
            return "Selecciona el Estado Final (pestaña Cierre)";
          return null;
        }

        async function handleGenerarPDF() {
          const error = validar();
          if (error) {
            setToast({ msg: error, type: "err" });
            return;
          }

          const urlOk = POWER_AUTOMATE_URL !== "TU_URL_POWER_AUTOMATE_AQUI";
          if (urlOk) {
            setEnviando(true);
            setToast({ msg: "Registrando en Excel…", type: "info" });
            try {
              await enviarAPowerAutomate(form, sections);
              setToast({
                msg: "Registrado en Excel correctamente",
                type: "ok",
              });
            } catch (e) {
              setToast({
                msg: "PDF generado, pero no se pudo registrar en Excel",
                type: "err",
              });
            } finally {
              setEnviando(false);
            }
            await new Promise((r) => setTimeout(r, 800));
          }
          // Nombre del archivo PDF: MP-Punto-IDAtm
          const puntoSlug = (form.punto || "SinPunto")
            .normalize("NFD")
            .replace(/[̀-ͯ]/g, "") // quitar tildes
            .replace(/[^a-zA-Z0-9\s-]/g, "") // solo alfanum y guiones
            .trim()
            .replace(/\s+/g, "-"); // espacios → guiones
          const idSlug = (form.idAtm || "SinID").replace(/[^a-zA-Z0-9]/g, "");
          const pdfTitle = "MP-" + puntoSlug + "-" + idSlug;

          const prevTitle = document.title;
          document.title = pdfTitle;
          window.print();
          document.title = prevTitle;
        }

        return (

                      onClick={() => setTab(4)}
                      style={{
                        width: "100%",
                        padding: 12,
                        background: "#f1f5f9",
                        color: "#475569",
                        border: "none",
                        borderRadius: 12,
                        fontWeight: 800,
                        cursor: "pointer",
                        marginBottom: 10,
                      }}
                    >
                      ← Atrás
                    </button>

                    <button
                      onClick={handleGenerarPDF}
                      disabled={enviando}
                      style={{
                        width: "100%",
                        padding: 16,
                        border: "none",
                        borderRadius: 14,
                        fontWeight: 800,
                        fontSize: 16,
                        cursor: enviando ? "wait" : "pointer",
                        background: enviando
                          ? "#475569"
                          : marcaObj?.color || "#0f172a",
                        color: "#fff",
                        boxShadow: "0 4px 15px rgba(0,0,0,.3)",
                        transition: "background .2s",
                      }}
                    >
                      {enviando
                        ? "⏳ Registrando en Excel…"
                        : "🖨️ Generar PDF y registrar en Excel"}
                    </button>

                    <div
                      style={{
                        marginTop: 10,
                        padding: "10px 14px",
                        borderRadius: 10,
                        background:
                          POWER_AUTOMATE_URL === "TU_URL_POWER_AUTOMATE_AQUI"
                            ? "#fef9c3"
                            : "#f0fdf4",
                        border:
                          "1px solid " +
                          (POWER_AUTOMATE_URL === "TU_URL_POWER_AUTOMATE_AQUI"
                            ? "#fde047"
                            : "#86efac"),
                      }}
                    >
                      <p
                        style={{
                          fontSize: 11,
                          fontWeight: 700,
                          color:
                            POWER_AUTOMATE_URL === "TU_URL_POWER_AUTOMATE_AQUI"
                              ? "#854d0e"
                              : "#166534",
                        }}
                      >
                        {POWER_AUTOMATE_URL === "TU_URL_POWER_AUTOMATE_AQUI"
                          ? "⚠️ Power Automate no configurado — solo se generará el PDF"
                          : "✅ Power Automate conectado — se registrará en Excel al generar el PDF"}
                      </p>
                    </div>

                    <p
                      style={{
                        textAlign: "center",
                        fontSize: 11,
                        color: "#94a3b8",
                        marginTop: 8,
                      }}
                    >
                      En el diálogo de impresión → "Guardar como PDF"
                    </p>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
