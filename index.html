<!doctype html>

    <meta charset="UTF-8" />

    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Plataforma interna para técnicos de campo — checklist de mantenimiento preventivo y acta de auditoría de cajeros automáticos ATM." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GICE" />
    <meta property="og:description" content="Plataforma interna para técnicos de campo — checklist de mantenimiento preventivo y acta de auditoría de cajeros automáticos ATM." />
    <meta property="og:image" content="/icons/apple-touch-icon.png" />

    <!-- PWA -->
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GICE" />

    <title>GICE</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- Google Analytics 4 — solo carga si VITE_GA_MEASUREMENT_ID está configurado
         (Vite deja el placeholder sin resolver si la env var no existe, por eso
         se valida con un regex en vez de comparar contra string vacío) -->
    <script>
      (function () {
        var GA_ID = '%VITE_GA_MEASUREMENT_ID%';
        if (!/^G-[A-Z0-9]+$/.test(GA_ID)) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', GA_ID, { send_page_view: false });
      })();
    </script>
  </head>
  <body>
    <script>
      (function() {
        var t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
